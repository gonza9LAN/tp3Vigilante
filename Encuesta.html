    <div class="form-container">
        <div class="row titulo">
            <h1>Encuesta Mundialista</h1>
        </div>
        <form method="GET" action="">
            <div class="row">
                <div class="form-check">
                    <label>1. ¿En qué año se celebró la primera Copa del Mundo?</label>
                    <div class="options">
                        <input class="form-check-input" type="radio" name="question1" value="1930" required>
                        <label>1930</label><br>
                        <input class="form-check-input" type="radio" name="question1" value="1920" required>
                        <label>1920</label><br>
                        <input class="form-check-input" type="radio" name="question1" value="1934" required>
                        <label>1934</label><br>
                        <input class="form-check-input" type="radio" name="question1" value="1926" required>
                        <label>1926</label><br>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="form-check">
                    <label>2. ¿Qué selección ha ganado más títulos en la historia de los Mundiales?</label>
                    <div class="options">
                        <input class="form-check-input" type="radio" name="question2" value="Argentina" required>
                        <label>Argentina</label><br>
                        <input class="form-check-input" type="radio" name="question2" value="Alemania" required>
                        <label>Alemania</label><br>
                        <input class="form-check-input" type="radio" name="question2" value="Brasil" required>
                        <label>Brasil</label><br>
                        <input class="form-check-input" type="radio" name="question2" value="Italia" required>
                        <label>Italia</label><br>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="form-check">
                    <label>3. ¿Qué selección fue la primera en ganar un Mundial en su debut?</label>
                    <div class="options">
                        <input class="form-check-input" type="radio" name="question3" value="Argentina" required>
                        <label>Argentina</label><br>
                        <input class="form-check-input" type="radio" name="question3" value="Inglaterra" required>
                        <label>Inglaterra</label><br>
                        <input class="form-check-input" type="radio" name="question3" value="Uruguay" required>
                        <label>Uruguay</label><br>
                        <input class="form-check-input" type="radio" name="question3" value="Italia" required>
                        <label>Italia</label><br>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="form-check">
                    <label>4. ¿Quién fue el jugador más joven en ganar un Mundial?</label>
                    <div class="options">
                        <input class="form-check-input" type="radio" name="question4" value="Mbappe" required>
                        <label>Mbappe</label><br>
                        <input class="form-check-input" type="radio" name="question4" value="Pele" required>
                        <label>Pele</label><br>
                        <input class="form-check-input" type="radio" name="question4" value="Ronaldo Nazario" required>
                        <label>Ronaldo Nazario</label><br>
                        <input class="form-check-input" type="radio" name="question4" value="Giuseppe Bergomi" required>
                        <label>Giuseppe Bergomi</label><br>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="form-check">
                    <label>5. ¿Cuál es la selección que ha disputado más finales?</label>
                    <div class="options">
                        <input class="form-check-input" type="radio" name="question5" value="Argentina" required>
                        <label>Argentina</label><br>
                        <input class="form-check-input" type="radio" name="question5" value="Alemania" required>
                        <label>Alemania</label><br>
                        <input class="form-check-input" type="radio" name="question5" value="Brasil" required>
                        <label>Brasil</label><br>
                        <input class="form-check-input" type="radio" name="question5" value="Italia" required>
                        <label>Italia</label><br>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="form-check">
                    <label>6. ¿Cuál fue la primer selección en conseguir dos Copas Mundiales?</label>
                    <div class="options">
                        <input class="form-check-input" type="radio" name="question6" value="Italia" required>
                        <label>Italia</label><br>
                        <input class="form-check-input" type="radio" name="question6" value="Alemania" required>
                        <label>Alemania</label><br>
                        <input class="form-check-input" type="radio" name="question6" value="Brasil" required>
                        <label>Brasil</label><br>
                        <input class="form-check-input" type="radio" name="question6" value="Uruguay" required>
                        <label>Uruguay</label><br>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="form-check">
                    <label>7. ¿Qué selección ha sido subcampeona en más ocasiones sin haber ganado nunca el título?</label>
                    <div class="options">
                        <input class="form-check-input" type="radio" name="question7" value="Paises Bajos" required>
                        <label>Países Bajos</label><br>
                        <input class="form-check-input" type="radio" name="question7" value="Suecia" required>
                        <label>Suecia</label><br>
                        <input class="form-check-input" type="radio" name="question7" value="Croacia" required>
                        <label>Croacia</label><br>
                        <input class="form-check-input" type="radio" name="question7" value="Hungria" required>
                        <label>Hungría</label><br>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="form-check">
                    <label>8. ¿En qué Mundial se jugó la primera final entre selecciones europeas?</label>
                    <div class="options">
                        <input class="form-check-input" type="radio" name="question8" value="1954" required>
                        <label>1954</label><br>
                        <input class="form-check-input" type="radio" name="question8" value="1966" required>
                        <label>1966</label><br>
                        <input class="form-check-input" type="radio" name="question8" value="1982" required>
                        <label>1982</label><br>
                        <input class="form-check-input" type="radio" name="question8" value="1934" required>
                        <label>1934</label><br>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="form-check">
                    <label>9. ¿Qué país ha organizado el Mundial más veces?</label>
                    <div class="options">
                        <input class="form-check-input" type="radio" name="question9" value="Uruguay" required>
                        <label>Uruguay</label><br>
                        <input class="form-check-input" type="radio" name="question9" value="Mexico" required>
                        <label>México</label><br>
                        <input class="form-check-input" type="radio" name="question9" value="USA" required>
                        <label>EE. UU.</label><br>
                        <input class="form-check-input" type="radio" name="question9" value="Brasil" required>
                        <label>Brasil</label><br>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="form-check">
                    <label>10. ¿En qué Mundial se jugó la final más goleada de la historia?</label>
                    <div class="options">
                        <input class="form-check-input" type="radio" name="question10" value="1958" required>
                        <label>1958</label><br>
                        <input class="form-check-input" type="radio" name="question10" value="1970" required>
                        <label>1970</label><br>
                        <input class="form-check-input" type="radio" name="question10" value="1954" required>
                        <label>1954</label><br>
                        <input class="form-check-input" type="radio" name="question10" value="1998" required>
                        <label>1998</label><br>
                    </div>
                </div>
            </div>
            <button type="submit" class="btn btn-primary">Enviar Respuestas</button>
        </form>
